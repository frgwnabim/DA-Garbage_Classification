# Deploy website demo (folder site/) ke GitHub Pages.
# Aktifkan sekali di GitHub: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy site ke GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deployment berjalan; deployment lama yang belum selesai dibatalkan
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cek file penting website
        run: |
          for f in site/index.html site/models/garbage_classifier.onnx site/models/labels.json \
                   site/models/preprocessing.json site/assets/samples/samples.json; do
            test -s "$f" || { echo "File hilang atau kosong: $f"; exit 1; }
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
